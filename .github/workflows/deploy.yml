name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('Manual deploy by {0}', github.actor) }}

# 合并到 main（CI 成功）即自动部署 Cloudflare。
# 合并关口归用户：任何 PR 合并前必须等用户拍板，不得自行合并。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm build:web

      - name: Patch wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
        run: |
          APP_VERSION="$(node -p "require('../package.json').version")" \
          perl -pi -e '
            s/CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER/$ENV{CLOUDFLARE_ACCOUNT_ID}/g;
            s/D1_DATABASE_NAME_PLACEHOLDER/$ENV{D1_DATABASE_NAME}/g;
            s/D1_DATABASE_ID_PLACEHOLDER/$ENV{D1_DATABASE_ID}/g;
            s/KV_NAMESPACE_ID_PLACEHOLDER/$ENV{KV_NAMESPACE_ID}/g;
            s/__APP_VERSION__/'\''$ENV{APP_VERSION}'\''/g;
          ' wrangler.toml
          # 可选表前缀（非 secret）：仅当 GitHub Variable TABLE_PREFIX 非空时注入 [vars]；
          # 未配置时 Worker 回退到默认 "post_"（共享 D1 零配置隔离）。
          if [ -n "$TABLE_PREFIX" ]; then
            printf '\n[vars]\nTABLE_PREFIX = "%s"\n' "$TABLE_PREFIX" >> wrangler.toml
          fi

      - name: Write secrets file
        working-directory: worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const secrets = {
              JWT_SECRET: process.env.JWT_SECRET,
              SETUP_SECRET: process.env.SETUP_SECRET,
            };
            for (const [name, value] of Object.entries(secrets)) {
              if (!value) {
                console.error(name + " is missing — configure it as a GitHub repository secret");
                process.exit(1);
              }
            }
            fs.writeFileSync(
              process.env.RUNNER_TEMP + "/secrets.json",
              JSON.stringify(secrets),
              { mode: 0o600 },
            );
          '

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
