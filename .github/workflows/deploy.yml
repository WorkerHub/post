name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('Manual deploy by {0}', github.actor) }}

# 合并到 main（CI 成功）即自动部署 Cloudflare。
# 合并关口归用户：任何 PR 合并前必须等用户拍板，不得自行合并。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      - name: Patch wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          APP_VERSION="$(node -p "require('../package.json').version")" \
          perl -pi -e '
            s/CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER/$ENV{CLOUDFLARE_ACCOUNT_ID}/g;
            s/D1_DATABASE_NAME_PLACEHOLDER/$ENV{D1_DATABASE_NAME}/g;
            s/D1_DATABASE_ID_PLACEHOLDER/$ENV{D1_DATABASE_ID}/g;
            s/__APP_VERSION__/'\''$ENV{APP_VERSION}'\''/g;
          ' wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
