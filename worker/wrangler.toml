name = "post"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"


[define]
APP_VERSION = "__APP_VERSION__"

[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

# 敏感密钥不放 [vars]（ONE-192）：占位符值一旦随部署发出，回传同值即可过 safeEqual 越权。
# 本地开发用 worker/.dev.vars（见 .dev.vars.example，已被 gitignore）；
# 线上由 CI 经 --secrets-file 上传，唯一可信源为 GitHub repo Secrets（JWT_SECRET / SETUP_SECRET）。
# 未配置/过短/占位符时 fail-safe：所有 /api/* 一律 500（见 src/index.ts）。

[triggers]
crons = ["*/5 * * * *"]
